[project]
name = "crm-starter-modules"
version = "0.2.0"
description = "Starter modules suite for CRM Starter: Postgres and Redis providers, Companies, People, Todo Kanban, Sales Deals, Activities, Documents, Leads, Products & Quotes, Support Tickets, Contracts, Marketing Campaigns, and Time Tracking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The Redis provider needs a client; everything else here needs nothing.
redis = ["redis>=5.0"]

[project.entry-points."crm.modules"]
db_postgres = "starter_module.db_postgres"
db_redis = "starter_module.db_redis"
crm_companies = "starter_module.crm_companies"
crm_people = "starter_module.crm_people"
todo_actions = "starter_module.todo_actions"
sales_deals = "starter_module.sales_deals"
crm_activities = "starter_module.crm_activities"
documents_attachments = "starter_module.documents_attachments"
lead_management = "starter_module.lead_management"
products_quotes = "starter_module.products_quotes"
customer_support = "starter_module.customer_support"
contracts_subscriptions = "starter_module.contracts_subscriptions"
marketing_campaigns = "starter_module.marketing_campaigns"
time_tracking = "starter_module.time_tracking"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starter_module"]

# Matched to crm_starter's, so a module lints the same way the framework it
# plugs into does.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
