name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    # The db_redis tests run against a real server, not a fake: what the
    # provider relies on is WATCH/MULTI aborting a transaction when the key
    # moved, and a fake that got that subtly wrong would pass here while the
    # thing it proves quietly failed in production.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment & Install dependencies
        run: |
          uv venv
          uv pip install hatchling ruff mypy mkdocs mkdocs-material pytest pytest-asyncio
          # crm_starter itself, which the modules import from. A checkout rather
          # than a package: its migrations/ and alembic.ini are not installed,
          # and the migration tests run `crm migrate` for real.
          git clone --depth 1 https://github.com/Sunyata-OU/crm_starter.git ../crm_starter
          uv pip install -e ../crm_starter
          uv pip install -e '.[redis]'

      - name: Run Ruff Linter
        run: uv run ruff check . || true

      - name: Run tests
        env:
          CRM_TEST_REDIS_URL: redis://localhost:6379/15
        run: uv run pytest tests -q

      - name: Build MkDocs Documentation Site
        run: uv run mkdocs build
